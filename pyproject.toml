[project]
name = "comments-ai-bot"
version = "0.1.0"
description = "Telegram system for AI-generated comments in public channels."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.6.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.4",
    "asyncpg>=0.29.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "telethon>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[project.scripts]
comments-admin-bot = "comments_ai_bot.admin_bot.main:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
